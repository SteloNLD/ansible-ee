version: 3

images:
  base_image:
    name: registry.access.redhat.com/ubi9/python-312:latest

dependencies:
  ansible_core:
    # >=2.21 is also a guard: if the python3->3.12 repoint below ever regresses,
    # 3.9 can't satisfy this and the build fails loudly instead of shipping 2.15.
    package_pip: ansible-core>=2.21
  ansible_runner:
    package_pip: ansible-runner
  python:
    - ansible-lint
    # hetzner.hcloud SDK (inventory plugin + modules).
    - hcloud
    # network_cli transport for community.routeros / vyos.vyos over SSH.
    - paramiko
    # RouterOS API transport for community.routeros api_* modules.
    - librouteros
  galaxy:
    collections:
      - name: community.general
      - name: community.crypto
      - name: ansible.posix
      # RouterOS management — connection, facts, command, api_modify.
      - name: community.routeros
      # network_cli connection community.routeros / vyos.vyos ride on.
      - name: ansible.netcommon
      # Hetzner Cloud dynamic inventory + resource modules.
      - name: hetzner.hcloud
      # VyOS management.
      - name: vyos.vyos

additional_build_steps:
  prepend_base:
    # UBI9's /usr/bin/python3 is 3.9, which caps ansible-core at 2.15. Repoint it
    # at the image's own 3.12 (which has pip) so the build gets a current core.
    # NB: not fedora:latest — its python 3.14 is newer than ansible-core supports.
    - USER root
    - RUN ln -sf /usr/bin/python3.12 /usr/bin/python3
  append_final:
    - RUN chgrp -R 0 /opt/app-root/src && chmod -R g=u /opt/app-root/src
